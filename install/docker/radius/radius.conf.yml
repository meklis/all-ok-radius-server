
#Logger configuration
# @TODO на данный момент реализован только вывод в консоль. Ориентировано для работы в docker
logger:
  console:
    enabled: true
    enable_color: false
    #Log levels. For production use - level 4, debug - 6
    log_level: 6
    print_file: true


#Prometheus configuration
prometheus:
  path: /metrics
  enabled: true
  port: 2112
  detailed: true


#Profiler pprof. Must be disabled in production
profiler:
  port: 2155
  enabled: false

#Конфигурация радиус-сервера
radius:
  listen_addr: ${RADIUS_LISTEN_ADDR}
  # Задаётся через переменную окружения RADIUS_SECRET (см. .env)
  secret: ${RADIUS_SECRET}

#Выбор бэкенда обработки auth/acct/postauth: api или script (Lua, см. блок script)
processor: script

#Встроенный Lua-скрипт. Каждый метод - свой скрипт (auth обязателен, acct/post_auth опциональны).
#Скрипты из script/examples репозитория копируются в образ в /opt/scripts (см. Dockerfile) -
#свои скрипты можно подложить вместо них, смонтировав volume поверх /opt/scripts
script:
  pool_size: 10
  timeout: 3s
  auth: /opt/scripts/auth.lua
  acct: /opt/scripts/acct.lua
  post_auth: /opt/scripts/post_auth.lua
  #База устройств/смартов/привязок, доступная в скриптах через глобальный db. Обязательна при
  #processor: script. Адрес задаётся через переменную окружения CLIENTDB_URL (см. .env)
  database:
    devices_url: ${CLIENTDB_URL}?type=devices
    #Строки binds имеют вид id;ip;client_mac[;device_mac;port] - id обязателен и должен
    #быть уникален в пределах источника, по нему применяются точечные обновления из redis (см. ниже)
    binds:
      clients: ${CLIENTDB_URL}?type=binds
      smart: ${CLIENTDB_URL}?type=smart
    refresh_interval: 5m
    timeout: 90s # binds отдаёт сотни тысяч строк - таймаут на весь запрос, включая чтение тела
    #Опционально: точечные обновления/удаления одной записи binds по id через redis pub/sub,
    #в дополнение к полному refresh_interval-reload по HTTP выше. Если addr не задан - не используется.
    redis:
      addr: ${CLIENTDB_REDIS_ADDR}
      channel: clientdb-bind-events

#Конфигурирование работы API. Используется только при processor: api
api:
  # Можно указать несколько API адресов. Они будут использоваться равномерно, по принципу round-robin.
  # Можно использовать для распределения нагрузки или как для резервирования.
  # Недоступные API будут исключаться из списка на некоторое время
  auth:
    # Настройки кеширования
    # Кеширование используется для уменьшения количества запросов к API.
    # Так же, если установить expire_timeout на много больше actualize_timeout это позволит хранить ответы с АПИ в памяти радиуса
    # и в случае отказа АПИ будут использоваться данные из него.
    #
    # Стоит учитывать что actualize_time не может быть больше lease_time_sec. Если подобное случается, устанавливается время лиза
    caching:
      actualize_timeout: 10s # Как часто нужно актуализироовать данные с API, даже если они есть в кеше
      enabled: true
      expire_timeout: 10m

    # Конфигурирование действий при недоступности API
    # Недоступностью считается - ошибки HTTP >= 500, проблемы с коннектом (connection timeout, connection refused, fail resolve domain)
    alive_checking:
      enabled: false
      disable_timeout: 60s # На это время API-адрес будет исключен из списка
    addresses:
      - ${API_ADDR}/radius/request
  acct:
    enabled: true
    count_readers: 5
    addresses:
      - ${API_ADDR}/radius/acct
  #Отправляет результат выдачи IP после ответа на запрос(или паралельно с ответом на запрос)
  postauth:
    enabled: true
    count_readers: 5
    addresses:
      - ${API_ADDR}/radius

  timeout: 3s # Максимальное время ответа API
